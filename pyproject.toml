[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "id-detector"
version = "0.1.0"
description = "Evidence-first track identification for DJ sets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.1",
  "jsonschema>=4.25.1",
  "numpy>=2.3.2",
  "psutil>=7.0.0",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.7",
  "pywin32>=311; sys_platform == 'win32'",
  "shazamio-core==1.1.2",
  "shazamio==0.8.1",
  "typer>=0.16.1",
  "yt-dlp>=2026.8.19",
]

[project.scripts]
id-detector = "id_detector.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/id_detector"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: requires network access or a live external provider",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
