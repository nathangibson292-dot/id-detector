[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "id-detector"
version = "0.1.0"
description = "Evidence-first track identification for DJ sets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "jsonschema>=4.25.1",
  "numpy>=2.3.2",
  "psutil>=7.0.0",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.7",
  "pywin32>=311; sys_platform == 'win32'",
  "shazamio-core==1.1.2",
  "shazamio==0.8.1",
  "typer>=0.16.1",
  "uvicorn>=0.35.0",
  "yt-dlp>=2026.8.19",
]

[project.scripts]
idea = "id_detector.cli:app"

[dependency-groups]
dev = [
  "hatchling>=1.27.0",
  "pytest>=8.4.1",
  "ruff>=0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/id_detector", "src/idea_web"]

# The single pricing authority lives at the repository root (plan §3.3). The wheel carries a
# build-time copy so an installed `idea` prices runs identically; there is no second committed
# copy that could drift from the authority.
[tool.hatch.build.targets.wheel.force-include]
"pricing.toml" = "id_detector/resources/pricing.toml"

[tool.pytest.ini_options]
# Default run is fast and offline: it deselects both slow (controlled-render / full-pipeline) and
# live (network) tests. Full offline run: `uv run pytest -m "not live"`. Live: `uv run pytest -m live`.
addopts = "-m 'not slow and not live'"
markers = [
  "live: requires network access or a live external provider",
  "slow: renders audio or drives the full pipeline; deselected by default (see tests/conftest.py)",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
