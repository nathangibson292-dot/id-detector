{{ head | safe }}<body>{{ topbar | safe }}<main class="auth">
<h1>Choose a password</h1>
<p class="lede">This link works once. Use at least {{ min_length }} characters.</p>
<form method="post" action="{{ action }}" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf }}">
<label for="password">New password
<input id="password" name="password" type="password" required autocomplete="new-password" minlength="{{ min_length }}"></label>
<label for="confirm">New password again
<input id="confirm" name="confirm" type="password" required autocomplete="new-password" minlength="{{ min_length }}"></label>
<p class="form-error" role="alert">{{ error }}</p>
<button class="btn primary big" type="submit">Set password and sign in</button>
</form>
</main></body></html>
