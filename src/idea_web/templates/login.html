{{ head | safe }}<body>{{ topbar | safe }}<main class="auth">
<h1>Sign in</h1>
<p class="lede">ID'er is in private beta. Accounts are created by the ID'er team; there is no sign-up.</p>
{% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
<form method="post" action="/login" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf }}">
<label for="email">Email
<input id="email" name="email" type="email" required autocomplete="username" maxlength="254" value="{{ email }}"></label>
<label for="password">Password
<input id="password" name="password" type="password" required autocomplete="current-password"></label>
<p class="form-error" role="alert">{{ error }}</p>
<button class="btn primary big" type="submit">Sign in</button>
</form>
<p class="lede">Forgotten your password? Ask the ID'er team for a reset link.</p>
</main></body></html>
