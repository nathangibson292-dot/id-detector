{{ head | safe }}<body>{{ topbar | safe }}<main class="job">
<header class="job-head"><div class="titles"><p class="eyebrow" id="eyebrow">Analysing</p>
<h1 id="title">{{ title }}</h1>{{ platform_chip | safe }}</div>
<div class="job-actions"><span class="st" id="status">…</span>
<button class="btn danger" id="cancel" type="button">Cancel</button></div></header>
{{ scan | safe }}
{{ outcome | safe }}
{{ player | safe }}
<details class="log"><summary>Steps and log</summary>
<div class="steps">{% for key, name, sub in steps %}<div class="step" data-step="{{ key }}">
<div class="k"><i>{{ loop.index }}</i>{{ name }}</div><small>{{ sub }}</small></div>{% endfor %}</div>
<pre id="log"></pre></details>
{{ footer | safe }}</main><script>{{ config | safe }}</script>
<script src="{{ script_src }}"></script></body></html>
