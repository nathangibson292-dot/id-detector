# Third-party audio uploads require this local setting AND the CLI ownership confirmation.
# Copy this file to id-detector.toml; that destination is ignored by Git.
allow_third_party_upload = false

# Frozen profiles (Stage 4d).  Prefer `id-detector analyse <url> --profile free` (or
# `--profile max_accuracy`) over hand-tuning the tables below: a profile is an immutable,
# evidence-derived artefact under profiles/<name>-v<K>.json that fixes the engines, the
# transform/schedule/rescan geometry and the hint/novelty toggles.  --profile overrides the
# [transforms]/[schedule]/[rescan] tables in this file.  Re-freeze with:
#   id-detector benchmark freeze-profiles \
#     --ablations data/corpus/controlled-synth-1/ablations.json \
#     --shortlist data/corpus/controlled-synth-1/shortlist.json --out profiles
# In v1 both profiles enable only Shazam (the only available engine); AudD/ACRCloud need
# credentials and Panako needs a JDK, so they are recorded as eligible-when-available, not enabled.
# The tables below remain the defaults used when no --profile is passed.

# Stage 4b defaults, recorded in data/corpus/controlled-synth-1/transforms-schedule.json.
[transforms]
policy = "rescan_only"
rate_e4 = [9200, 9600, 10400, 10800]
semitones = [-2, -1, 1, 2]

# Generation-0 schedule (plan rev 5.2): coverage-complete at the active measured L_min.
[schedule]
window_ms = 12000
hop_ms = 9000
phase_ms = 0

# Base rescan policy (plan rev 5.2): the Stage 4b benchmark's denser schedule, consumed by the
# Stage 4c generation loop. It is used directly by the whole-episode triggers (contested,
# long_episode) and clamps the shorter boundary policies the plan requires for edges, gaps and
# spectral-novelty change points (6-8 s windows with shifted phases).
[rescan]
window_ms = 12000
hop_ms = 5000
phase_ms = 0
# Generations after generation 0; 0 disables rescans. --max-generations overrides this.
max_generations = 3

# --------------------------------------------------------------------------------------------------
# Stage 5 -- calibration & test (no TOML keys; commands only)
# --------------------------------------------------------------------------------------------------
# Scores/tiers are HEURISTIC unless a frozen calibration model exists for the selected profile at
# calibration/<profile>-v<K>.json. None is committed for `free`/`max_accuracy` (no owner-verified
# real-mix calibration corpus exists), so `analyse --profile <name>` stays heuristic and every
# real-mix tier stays provisional. To exercise the machinery on the controlled corpus, and to run a
# single frozen-test certification (real-mix tiers stay provisional with n_test_predictions 0):
#
#   id-detector benchmark calibration-validate --corpus controlled-synth-1
#   id-detector benchmark certify --corpus <frozen-corpus> --profile <name> --test-version <v>
#
# `certify` refuses an unfrozen corpus and refuses to reuse a (profile, test_version) pair.
